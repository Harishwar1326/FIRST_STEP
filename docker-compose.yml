version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: firststep_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - firststep_network

  redis:
    image: redis:7-alpine
    container_name: firststep_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - firststep_network

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: firststep_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    networks:
      - firststep_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firststep_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/firststep
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=super_secret_firststep_development_jwt_key_123!
    depends_on:
      - mongodb
      - redis
      - chromadb
    networks:
      - firststep_network

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: firststep_ai_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    networks:
      - firststep_network

networks:
  firststep_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  chromadb_data:
